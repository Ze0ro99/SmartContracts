# =====================================================================
#  OMNI SmartContracts — Professional CI/CD, Testnet Audit & Reporting
#  Repository : Ze0ro99/SmartContracts
#  Companion  : Ze0ro99/PiRC (asset import + registry sync via OMNI_SYNC_TOKEN)
#  Scope      : Discovery → Isolated Build → Test → Security Audit →
#               Testnet Deployment → Engineering Diagrams → Reports →
#               PiRC Sync → Master Summary
# =====================================================================

name: OMNI SmartContracts Pipeline

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * *'          # Daily full audit at 03:00 UTC
  workflow_dispatch:
    inputs:
      target_contract:
        description: 'Specific contract folder (empty = all valid contracts)'
        required: false
        default: ''
      deploy_testnet:
        description: 'Run Pi Testnet preflight only; no signing or deployment'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.88'
  SOROBAN_SDK_VERSION: '23.0.0'
  ARTIFACTS_RETENTION_DAYS: 30
  CARGO_TERM_COLOR: always

jobs:

  # =========================================================
  # 1. Discovery — valid contracts + PiRC asset import
  # =========================================================
  discover:
    name: Discover Contracts & Import PiRC Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_contracts: ${{ steps.set-matrix.outputs.has_contracts }}
      has_subscription: ${{ steps.check-sub.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import public PiRC repository (read-only)
        id: import-pirc
        uses: actions/checkout@v4
        with:
          repository: Ze0ro99/PiRC
          path: pirc-import
          fetch-depth: 1

      - name: Import canonical PiRC schemas and registry (fail closed)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -d pirc-import/schemas/v1
          test -s pirc-import/registries/seven-layer-registry.v1.json
          mkdir -p imported/pirc/schemas/v1 imported/pirc/registries
          cp pirc-import/schemas/v1/*.json imported/pirc/schemas/v1/
          cp pirc-import/registries/seven-layer-registry.v1.json imported/pirc/registries/
          schema_count="$(find imported/pirc/schemas/v1 -maxdepth 1 -type f -name '*.json' | wc -l)"
          test "$schema_count" -gt 0
          jq -n \
            --arg repository "Ze0ro99/PiRC" \
            --arg source_sha "$(git -C pirc-import rev-parse HEAD)" \
            --arg run_id "$RUN_ID" \
            --arg imported_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg registry "registries/seven-layer-registry.v1.json" \
            --argjson schema_count "$schema_count" \
            '{source_repository:$repository,source_commit:$source_sha,run_id:$run_id,imported_at:$imported_at,registry:$registry,schema_count:$schema_count,mode:"SOURCE_IMPORT_NO_FALLBACK"}' \
            > imported/pirc/import-report.json
          echo "Imported $schema_count canonical PiRC schemas and the versioned seven-layer registry."
          find imported/pirc -type f -print | sort
      - name: Discover contracts with valid Cargo.toml
        id: set-matrix
        env:
          TARGET_CONTRACT: ${{ github.event.inputs.target_contract }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          VALID=()

          for dir in contracts/*/; do
            [ -f "${dir}Cargo.toml" ] || continue
            name=$(basename "$dir")
            if python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))" "${dir}Cargo.toml" 2>/dev/null; then
              echo "  ✓ valid   : $name" ; VALID+=("$name")
            else
              echo "  ✗ skipped : $name (invalid Cargo.toml)"
            fi
          done

          # Pull requests and pushes validate only contracts touched by that change.
          # Scheduled and manually dispatched full audits may still scan every valid contract.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
              git fetch --no-tags origin "$BASE_SHA" --depth=1
              mapfile -t CHANGED_CONTRACTS < <(
                git diff --name-only "$BASE_SHA...HEAD" |
                  awk -F/ '$1 == "contracts" && NF >= 2 { print $2 }' |
                  sort -u
              )
              VALID=()
              for name in "${CHANGED_CONTRACTS[@]}"; do
                if [ -f "contracts/$name/Cargo.toml" ] &&
                   python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))" "contracts/$name/Cargo.toml" 2>/dev/null; then
                  VALID+=("$name")
                fi
              done
              # Workflow/docs-only changes still exercise the canonical settlement crate.
              if [ ${#VALID[@]} -eq 0 ] && [ -f "contracts/economic_settlement/Cargo.toml" ]; then
                VALID=("economic_settlement")
              fi
            else
              # Script/workflow-only changes still smoke-test the canonical settlement contract.
              if [ -f "contracts/economic_settlement/Cargo.toml" ]; then
                VALID=("economic_settlement")
              else
                VALID=()
              fi
            fi
          fi

          if [ -n "$TARGET_CONTRACT" ]; then
            [ -f "contracts/$TARGET_CONTRACT/Cargo.toml" ] || { echo "Unknown target contract: $TARGET_CONTRACT"; exit 1; }
            MATRIX=$(jq -nc --arg c "$TARGET_CONTRACT" '{include:[{contract:$c}]}')
          elif [ ${#VALID[@]} -eq 0 ]; then
            echo "has_contracts=false" >> "$GITHUB_OUTPUT"
            echo "matrix=$(jq -nc '{include: []}')" >> "$GITHUB_OUTPUT"
            exit 0
          else
            MATRIX=$(printf '%s\n' "${VALID[@]}" | jq -Rnc '{include: [inputs | {contract: .}]}')
          fi

          echo "has_contracts=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX"     >> "$GITHUB_OUTPUT"
          echo "Final matrix: $MATRIX"

      - name: Check subscription contract
        id: check-sub
        run: |
          if [ -f "contracts/subscription/Cargo.toml" ] && \
             python3 -c "import tomllib; tomllib.load(open('contracts/subscription/Cargo.toml','rb'))" 2>/dev/null; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload prepared PiRC assets
        uses: actions/upload-artifact@v4
        with:
          name: pirc-prepared-assets
          path: imported/
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}
          if-no-files-found: ignore

  # =========================================================
  # 2. Build • Test • Security Audit (isolated, per contract)
  # =========================================================
  build-test-audit:
    name: Build • Test • Audit → ${{ matrix.contract }}
    needs: discover
    if: needs.discover.outputs.has_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      CONTRACT: ${{ matrix.contract }}
    steps:
      - uses: actions/checkout@v4

      - name: Download PiRC assets
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pirc-prepared-assets
          path: imported/

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.contract }}-${{ hashFiles(format('contracts/{0}/Cargo.toml', matrix.contract)) }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.contract }}-

      - name: Create isolated workspace
        run: |
          set -euo pipefail
          cp Cargo.toml Cargo.toml.bak 2>/dev/null || true
          cat > Cargo.toml << EOF
          [workspace]
          resolver = "2"
          members = ["contracts/$CONTRACT"]

          [workspace.dependencies]
          soroban-sdk = "${{ env.SOROBAN_SDK_VERSION }}"

          [profile.release]
          opt-level = "z"
          overflow-checks = true
          debug = 0
          strip = "symbols"
          debug-assertions = false
          panic = "abort"
          codegen-units = 1
          lto = true
          EOF

      - name: Build (wasm32, release)
        run: cargo build --target wasm32-unknown-unknown --release --manifest-path "contracts/$CONTRACT/Cargo.toml"

      - name: Unit tests
        run: cargo test --manifest-path "contracts/$CONTRACT/Cargo.toml" -- --nocapture

      - name: Lint & format check
        continue-on-error: true
        run: |
          cargo clippy --manifest-path "contracts/$CONTRACT/Cargo.toml" --all-targets -- -D warnings
          cargo fmt    --manifest-path "contracts/$CONTRACT/Cargo.toml" --check

      - name: Security audit (cargo-audit)
        continue-on-error: true
        run: |
          cargo install --locked cargo-audit 2>/dev/null || true
          mkdir -p "reports/$CONTRACT"
          cargo audit --file "contracts/$CONTRACT/Cargo.lock" --json \
            > "reports/$CONTRACT/security-audit.json" 2>/dev/null || \
          cargo audit --json > "reports/$CONTRACT/security-audit.json" || true

      - name: Ensure reporting scripts exist (self-bootstrapping)
        run: |
          mkdir -p scripts "reports/$CONTRACT"
          if [ ! -f scripts/generate_professional_report.py ]; then
            cat > scripts/generate_professional_report.py << 'PYEOF'
          import argparse, json, os, subprocess, datetime, glob

          p = argparse.ArgumentParser()
          p.add_argument("--contract", required=True)
          p.add_argument("--deep", action="store_true")
          a = p.parse_args()

          out = f"reports/{a.contract}"
          os.makedirs(out, exist_ok=True)
          src = f"contracts/{a.contract}/src"
          files = glob.glob(f"{src}/**/*.rs", recursive=True)
          loc = sum(len(open(f, errors="ignore").readlines()) for f in files)
          wasm = glob.glob(f"target/wasm32-unknown-unknown/release/*.wasm")
          wasm_size = os.path.getsize(wasm[0]) if wasm else 0

          report = {
              "contract": a.contract,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "mode": "deep" if a.deep else "standard",
              "source_files": len(files),
              "lines_of_code": loc,
              "wasm_size_bytes": wasm_size,
              "pipeline": "OMNI SmartContracts Pipeline",
          }
          json.dump(report, open(f"{out}/report.json", "w"), indent=2)

          with open(f"{out}/REPORT.md", "w") as f:
              f.write(f"# Audit Report — {a.contract}\n\n")
              f.write(f"- **Generated:** {report['generated_at']}\n")
              f.write(f"- **Mode:** {report['mode']}\n")
              f.write(f"- **Rust source files:** {len(files)}\n")
              f.write(f"- **Lines of code:** {loc}\n")
              f.write(f"- **Optimized WASM size:** {wasm_size} bytes\n")
          print(f"Report written to {out}/")
          PYEOF
          fi

          if [ ! -f scripts/generate_diagrams.py ]; then
            cat > scripts/generate_diagrams.py << 'PYEOF'
          import argparse, os, re, glob

          p = argparse.ArgumentParser()
          p.add_argument("--contract", required=True)
          a = p.parse_args()

          out = f"reports/{a.contract}"
          os.makedirs(out, exist_ok=True)
          fns = []
          for f in glob.glob(f"contracts/{a.contract}/src/**/*.rs", recursive=True):
              fns += re.findall(r"pub fn (\w+)", open(f, errors="ignore").read())

          with open(f"{out}/ARCHITECTURE.md", "w") as f:
              f.write(f"# Engineering Diagram — {a.contract}\n\n```mermaid\nflowchart TD\n")
              f.write(f'    U[Caller / dApp] --> C["{a.contract} contract"]\n')
              for fn in sorted(set(fns))[:20]:
                  f.write(f'    C --> {fn}["{fn}()"]\n')
              f.write("    C --> L[(Contract Storage)]\n```\n")
          print(f"Diagram written to {out}/ARCHITECTURE.md")
          PYEOF
          fi

      - name: Generate professional report & engineering diagram
        run: |
          python3 scripts/generate_professional_report.py --contract "$CONTRACT"
          python3 scripts/generate_diagrams.py --contract "$CONTRACT"

      - name: Collect WASM artifact
        run: |
          mkdir -p "wasm-out/$CONTRACT"
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' \
            -exec cp {} "wasm-out/$CONTRACT/" \; || true

      - name: Restore original workspace
        if: always()
        run: '[ -f Cargo.toml.bak ] && mv Cargo.toml.bak Cargo.toml || true'

      - name: Upload contract report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.contract }}
          path: reports/${{ matrix.contract }}/
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}
          if-no-files-found: ignore

      - name: Upload WASM binary
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.contract }}
          path: wasm-out/${{ matrix.contract }}/
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}
          if-no-files-found: ignore

  # =========================================================
  # 3. Testnet Deployment & Verification (per contract)
  # =========================================================
  testnet-verify:
    name: Pi Testnet Preflight (read-only) → ${{ matrix.contract }}
    needs: [discover, build-test-audit]
    if: >
      needs.discover.outputs.has_contracts == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy_testnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      CONTRACT: ${{ matrix.contract }}
      PI_HORIZON_URL: https://api.testnet.minepi.com
      PI_SOROBAN_RPC_URL: https://rpc.testnet.minepi.com
      PI_NETWORK_PASSPHRASE: Pi Testnet
      PI_EXPECTED_PROTOCOL: "28"
    steps:
      - uses: actions/checkout@v4

      - name: Download reviewed WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-${{ matrix.contract }}
          path: wasm/

      - name: Verify Pi Testnet identity and record artifact (read-only)
        shell: bash
        run: |
          set -euo pipefail
          rpc() {
            local method="$1"
            curl --fail --silent --show-error --retry 2 --retry-delay 2 \
              --connect-timeout 10 --max-time 20 \
              -H 'content-type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":{}}" \
              "$PI_SOROBAN_RPC_URL"
          }
          horizon="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 \
            --connect-timeout 10 --max-time 20 "$PI_HORIZON_URL/")"
          network="$(rpc getNetwork)"
          health="$(rpc getHealth)"
          latest="$(rpc getLatestLedger)"
          test "$(jq -r '.network_passphrase // empty' <<<"$horizon")" = "$PI_NETWORK_PASSPHRASE"
          test "$(jq -r '.result.passphrase // .result.networkPassphrase // empty' <<<"$network")" = "$PI_NETWORK_PASSPHRASE"
          test "$(jq -r '.result.protocolVersion // empty' <<<"$network")" = "$PI_EXPECTED_PROTOCOL"
          health_status="$(jq -r '.result.status // empty' <<<"$health" | tr '[:upper:]' '[:lower:]')"
          test "$health_status" = "healthy" -o "$health_status" = "ok"
          latest_ledger="$(jq -r '.result.sequence // .result.ledger // empty' <<<"$latest")"
          test "$latest_ledger" -gt 0
          horizon_protocol="$(jq -r '.core_supported_protocol_version // empty' <<<"$horizon")"
          test "$horizon_protocol" -ge "$PI_EXPECTED_PROTOCOL"
          wasm="$(find wasm -type f -name '*.wasm' -print -quit)"
          test -n "$wasm"
          wasm_sha="$(sha256sum "$wasm" | awk '{print $1}')"
          mkdir -p "reports/$CONTRACT"
          {
            echo "# Pi Testnet Preflight — $CONTRACT"
            echo "- Network identity: VERIFIED (Pi Testnet)"
            echo "- Soroban protocol: $PI_EXPECTED_PROTOCOL"
            echo "- RPC health: $health_status"
            echo "- Latest ledger: $latest_ledger"
            echo "- WASM artifact: $(basename "$wasm")"
            echo "- WASM SHA-256: $wasm_sha"
            echo "- Deployment: NOT PERFORMED"
            echo "- Contract ID/code hash/state readback: NOT VERIFIED"
            echo "- Signing/transactions: NONE"
          } | tee "reports/$CONTRACT/testnet-preflight.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: testnet-preflight-${{ matrix.contract }}
          path: reports/${{ matrix.contract }}/
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}
          if-no-files-found: error

  # =========================================================
  # 4. Deep Audit — Subscription contract
  # =========================================================
  subscription-deep-audit:
    name: Deep Audit — Subscription
    needs: discover
    if: needs.discover.outputs.has_subscription == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Isolated workspace
        run: |
          cp Cargo.toml Cargo.toml.bak 2>/dev/null || true
          cat > Cargo.toml << EOF
          [workspace]
          resolver = "2"
          members = ["contracts/subscription"]
          [workspace.dependencies]
          soroban-sdk = "${{ env.SOROBAN_SDK_VERSION }}"
          [profile.release]
          opt-level = "z"
          overflow-checks = true
          debug = 0
          strip = "symbols"
          panic = "abort"
          codegen-units = 1
          lto = true
          EOF

      - name: Deep build, test & strict lint
        run: |
          cargo build --target wasm32-unknown-unknown --release --manifest-path contracts/subscription/Cargo.toml
          cargo test  --manifest-path contracts/subscription/Cargo.toml -- --nocapture
          cargo clippy --manifest-path contracts/subscription/Cargo.toml --all-targets -- \
            -D warnings -W clippy::unwrap_used -W clippy::expect_used -W clippy::panic || true

      - name: Deep report & diagram
        run: |
          mkdir -p scripts reports/subscription
          [ -f scripts/generate_professional_report.py ] && \
            python3 scripts/generate_professional_report.py --contract subscription --deep || true
          [ -f scripts/generate_diagrams.py ] && \
            python3 scripts/generate_diagrams.py --contract subscription || true

      - name: Restore workspace
        if: always()
        run: '[ -f Cargo.toml.bak ] && mv Cargo.toml.bak Cargo.toml || true'

      - uses: actions/upload-artifact@v4
        with:
          name: subscription-deep-audit
          path: reports/subscription/
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}
          if-no-files-found: ignore

  # =========================================================
  # 5. Sync results back to PiRC (main branch only)
  # =========================================================
  prepare-pirc-sync-evidence:
    name: Prepare PiRC Sync Evidence (no automatic push)
    needs: [build-test-audit, testnet-verify]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build-test-audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download contract reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Create reviewable PiRC sync manifest
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build-test-audit.result }}
          TESTNET_PREFLIGHT_RESULT: ${{ needs.testnet-verify.result }}
        run: |
          set -euo pipefail
          mkdir -p pirc-sync-evidence
          jq -n \
            --arg source "SmartContracts" \
            --arg run_id "$RUN_ID" \
            --arg commit "$SHA" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg build "$BUILD_RESULT" \
            --arg testnet_preflight "$TESTNET_PREFLIGHT_RESULT" \
            '{source:$source,run_id:$run_id,commit:$commit,generated_at:$generated_at,build_test_audit:$build,testnet_preflight:$testnet_preflight,automatic_cross_repository_push:false,review_required:true}' \
            > pirc-sync-evidence/LAST_SYNC.json
          cp -r all-reports/. pirc-sync-evidence/reports/ 2>/dev/null || true

      - name: Upload reviewable PiRC sync evidence
        uses: actions/upload-artifact@v4
        with:
          name: pirc-sync-evidence
          path: pirc-sync-evidence/
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}
          if-no-files-found: error

  # =========================================================
  # 6. Master Summary
  # =========================================================
  finalize:
    name: Master Summary
    needs: [discover, build-test-audit, testnet-verify, subscription-deep-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Build master report & job summary
        env:
          R_BUILD: ${{ needs.build-test-audit.result }}
          R_TESTNET: ${{ needs.testnet-verify.result }}
          R_DEEP: ${{ needs.subscription-deep-audit.result }}
        run: |
          {
            echo "# OMNI SmartContracts — Master Pipeline Report"
            echo ""
            echo "**Generated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Commit:** ${GITHUB_SHA}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Build • Test • Audit | $R_BUILD |"
            echo "| Testnet Verification | $R_TESTNET |"
            echo "| Subscription Deep Audit | $R_DEEP |"
            echo ""
            echo "## Guarantees"
            echo "- Only contracts with valid \`Cargo.toml\` are processed; corrupted packages are skipped automatically."
            echo "- Every contract builds in an isolated workspace (no cross-contract pollution)."
            echo "- PiRC assets are imported when reachable, otherwise auto-generated fallbacks are used."
            echo "- Reports, security audits, and engineering diagrams are produced per contract."
          } | tee MASTER_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MASTER-PIPELINE-REPORT
          path: |
            MASTER_REPORT.md
            all-reports/
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}
          if-no-files-found: ignore

