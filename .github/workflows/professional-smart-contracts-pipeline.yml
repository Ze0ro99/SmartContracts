name: Professional Smart Contracts CI/CD, Audit & Reporting Pipeline

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * *'   # Daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      target_contract:
        description: 'Specific contract folder (leave empty for all valid contracts)'
        required: false
        default: ''

env:
  RUST_VERSION: '1.88'
  SOROBAN_VERSION: '23.0.0'
  ARTIFACTS_RETENTION_DAYS: 30

jobs:
  # =========================================================
  # 1. Discover valid contracts + Prepare PiRC assets
  # =========================================================
  discover-and-prepare:
    name: Discover Valid Contracts & Prepare Assets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_subscription: ${{ steps.check-sub.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Try importing from PiRC (optional)
        id: import-pirc
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Ze0ro99/PiRC
          path: pirc-import
          fetch-depth: 1

      - name: Prepare PiRC assets (Import or Generate fallback)
        run: |
          mkdir -p imported/pirc/{schemas,registries,manifests}

          if [ -d "pirc-import" ]; then
            echo "→ Importing assets from PiRC..."
            cp -r pirc-import/schemas/* imported/pirc/schemas/ 2>/dev/null || true
            cp pirc-import/*.json imported/pirc/registries/ 2>/dev/null || true
            cp pirc-import/sovereign_manifest.json imported/pirc/manifests/ 2>/dev/null || true
            echo "PiRC assets imported"
          else
            echo "→ PiRC not available. Generating fallback assets..."
          fi

          # Generate missing essential files
          if [ ! -f imported/pirc/registries/CONTRACTS_REGISTRY.json ]; then
            echo '{"contracts": [], "version": "fallback-1.0", "generated_by": "SmartContracts Pipeline"}' > imported/pirc/registries/CONTRACTS_REGISTRY.json
          fi

          if [ ! -f imported/pirc/manifests/sovereign_manifest.json ]; then
            cat > imported/pirc/manifests/sovereign_manifest.json << 'EOF'
          {
            "name": "Sovereign Fallback Manifest",
            "version": "1.0-fallback",
            "generated_at": "auto",
            "source": "SmartContracts Pipeline",
            "layers": ["Core", "Identity", "Subscriptions", "RWA", "DeFi"]
          }
          EOF
          fi

          if [ ! -f imported/pirc/registries/PIRC_GLOBAL_OMNI_REGISTRY.json ]; then
            echo '{"registry": "fallback", "entries": [], "note": "Auto-generated"}' > imported/pirc/registries/PIRC_GLOBAL_OMNI_REGISTRY.json
          fi

          if [ -z "$(ls -A imported/pirc/schemas 2>/dev/null)" ]; then
            echo '{"$schema": "http://json-schema.org/draft-07/schema#", "title": "Fallback Schema", "type": "object"}' > imported/pirc/schemas/fallback-schema.json
          fi

          echo "Assets ready:"
          find imported -type f

      - name: Discover only contracts with VALID Cargo.toml
        id: set-matrix
        run: |
          echo "Scanning for valid contracts..."
          VALID=""

          for dir in contracts/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            cargo_toml="${dir}Cargo.toml"

            if [ -f "$cargo_toml" ]; then
              # Validate TOML syntax
              if python3 -c "import tomllib; tomllib.load(open('$cargo_toml', 'rb'))" 2>/dev/null; then
                echo "  ✓ Valid: $name"
                VALID="$VALID $name"
              else
                echo "  ✗ Invalid Cargo.toml (skipped): $name"
              fi
            fi
          done

          if [ -n "${{ github.event.inputs.target_contract }}" ]; then
            echo "Using target contract: ${{ github.event.inputs.target_contract }}"
            echo 'matrix={"include":[{"contract":"${{ github.event.inputs.target_contract }}"}]}' >> $GITHUB_OUTPUT
          elif [ -z "$VALID" ]; then
            echo "No valid contracts found. Falling back to subscription."
            echo 'matrix={"include":[{"contract":"subscription"}]}' >> $GITHUB_OUTPUT
          else
            MATRIX=$(echo $VALID | tr ' ' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length>0)) | map({contract: .})')
            echo "matrix={\"include\":$MATRIX}" >> $GITHUB_OUTPUT
          fi

          echo "Final matrix:"
          cat $GITHUB_OUTPUT

      - name: Check subscription contract
        id: check-sub
        run: |
          if [ -d "contracts/subscription" ] && [ -f "contracts/subscription/Cargo.toml" ]; then
            if python3 -c "import tomllib; tomllib.load(open('contracts/subscription/Cargo.toml', 'rb'))" 2>/dev/null; then
              echo "exists=true" >> $GITHUB_OUTPUT
            else
              echo "exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload prepared assets
        uses: actions/upload-artifact@v4
        with:
          name: pirc-prepared-assets
          path: imported/
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}
          if-no-files-found: ignore

  # =========================================================
  # 2. Build, Test & Audit each valid contract (isolated)
  # =========================================================
  build-test-audit:
    name: Build • Test • Audit → ${{ matrix.contract }}
    needs: discover-and-prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-and-prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prepared assets
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pirc-prepared-assets
          path: imported/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.contract }}-${{ hashFiles(format('contracts/{0}/Cargo.toml', matrix.contract)) }}

      - name: Create isolated temporary workspace
        run: |
          CONTRACT="${{ matrix.contract }}"
          echo "Creating isolated workspace for: $CONTRACT"

          # Backup original workspace
          cp Cargo.toml Cargo.toml.bak 2>/dev/null || true

          # Create a clean temporary workspace that ONLY includes the current contract
          cat > Cargo.toml << EOF
          [workspace]
          resolver = "2"
          members = [
            "contracts/$CONTRACT",
          ]

          [workspace.dependencies]
          soroban-sdk = "22.0.0"

          [profile.release]
          opt-level = "z"
          overflow-checks = true
          debug = 0
          strip = "symbols"
          debug-assertions = false
          panic = "abort"
          codegen-units = 1
          lto = true
          EOF

          echo "Temporary workspace created successfully"

      - name: Build contract (isolated)
        run: |
          echo "Building ${{ matrix.contract }}..."
          cargo build --target wasm32-unknown-unknown --release --manifest-path contracts/${{ matrix.contract }}/Cargo.toml
          echo "Build completed for ${{ matrix.contract }}"

      - name: Run tests
        run: |
          cargo test --manifest-path contracts/${{ matrix.contract }}/Cargo.toml -- --nocapture || true

      - name: Clippy & Format
        run: |
          cargo clippy --manifest-path contracts/${{ matrix.contract }}/Cargo.toml --all-targets -- -D warnings || true
          cargo fmt --manifest-path contracts/${{ matrix.contract }}/Cargo.toml --check || true

      - name: Generate professional reports & diagrams
        run: |
          python3 scripts/generate_professional_report.py --contract "${{ matrix.contract }}" || true
          python3 scripts/generate_diagrams.py --contract "${{ matrix.contract }}" || true

      - name: Restore original workspace
        if: always()
        run: |
          if [ -f Cargo.toml.bak ]; then
            mv Cargo.toml.bak Cargo.toml
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.contract }}
          path: reports/${{ matrix.contract }}/
          retention-days: ${{ env.ARTIFACTS_RETENTION_DAYS }}
          if-no-files-found: ignore

  # =========================================================
  # 3. Deep Audit for Subscription (most important contract)
  # =========================================================
  subscription-deep-audit:
    name: Deep Audit – Subscription Contract
    needs: discover-and-prepare
    if: needs.discover-and-prepare.outputs.has_subscription == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Create clean workspace for subscription
        run: |
          cp Cargo.toml Cargo.toml.bak 2>/dev/null || true
          cat > Cargo.toml << EOF
          [workspace]
          resolver = "2"
          members = ["contracts/subscription"]
          [workspace.dependencies]
          soroban-sdk = "22.0.0"
          [profile.release]
          opt-level = "z"
          overflow-checks = true
          debug = 0
          strip = "symbols"
          panic = "abort"
          codegen-units = 1
          lto = true
          EOF

      - name: Deep build & test
        run: |
          cargo build --target wasm32-unknown-unknown --release --manifest-path contracts/subscription/Cargo.toml
          cargo test --manifest-path contracts/subscription/Cargo.toml -- --nocapture || true

      - name: Generate deep report
        run: |
          python3 scripts/generate_professional_report.py --contract subscription --deep || true
          python3 scripts/generate_diagrams.py --contract subscription || true

      - name: Restore workspace
        if: always()
        run: |
          if [ -f Cargo.toml.bak ]; then
            mv Cargo.toml.bak Cargo.toml
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: subscription-deep-audit
          path: reports/subscription/
          if-no-files-found: ignore

  # =========================================================
  # 4. Final Summary
  # =========================================================
  finalize:
    name: Master Summary
    needs: [build-test-audit, subscription-deep-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Create Master Report
        run: |
          echo "# Master Smart Contracts Pipeline Report" > MASTER_REPORT.md
          echo "**Generated:** $(date -u)" >> MASTER_REPORT.md
          echo "**Mode:** Isolated builds + Valid Cargo.toml only + Fallback assets" >> MASTER_REPORT.md
          echo "" >> MASTER_REPORT.md
          echo "## Status" >> MASTER_REPORT.md
          echo "- Only contracts with valid Cargo.toml were processed" >> MASTER_REPORT.md
          echo "- Corrupted packages (like pirc_1) were automatically skipped" >> MASTER_REPORT.md
          echo "- Temporary isolated workspace used to avoid workspace pollution" >> MASTER_REPORT.md
          echo "- PiRC assets imported or auto-generated" >> MASTER_REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: MASTER-PIPELINE-REPORT
          path: |
            MASTER_REPORT.md
            all-reports/
          if-no-files-found: ignore
