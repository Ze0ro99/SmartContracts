name: PiRC reference contract checks

on:
  pull_request:
    paths:
      - 'contracts/pirc_207_registry_v3/**'
      - 'contracts/pirc_214_oracle_v2/**'
      - 'contracts/pirc_225_por_v2/**'
      - 'contracts/pirc_237_ai_oracle/**'
      - 'contracts/ousd_test_token/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pirc-reference-contracts.yml'
  push:
    branches:
      - main
      - integration/sovereign-hybrid-ecosystem

permissions:
  contents: read

jobs:
  reference-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Check formatting for changed reference Rust files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No valid base SHA; skipping changed-file formatting check."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mapfile -t rust_files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
            'contracts/pirc_207_registry_v3/**/*.rs' \
            'contracts/pirc_214_oracle_v2/**/*.rs' \
            'contracts/pirc_225_por_v2/**/*.rs' \
            'contracts/pirc_237_ai_oracle/**/*.rs' \
            'contracts/ousd_test_token/**/*.rs')
          if (("${#rust_files[@]}" > 0)); then
            rustfmt --check --edition 2021 "${rust_files[@]}"
          else
            echo "No reference-contract Rust sources changed; existing formatting baseline is unchanged."
          fi
      - name: Test reference crates
        run: cargo test -p pirc-207-registry-v3 -p pirc-214-oracle-v2 -p pirc-225-por-v2 -p pirc-237-ai-oracle -p ousd-test-token
      - name: Build Soroban WASM artifacts
        run: cargo build --release --target wasm32v1-none -p pirc-207-registry-v3 -p pirc-214-oracle-v2 -p pirc-225-por-v2 -p pirc-237-ai-oracle -p ousd-test-token
