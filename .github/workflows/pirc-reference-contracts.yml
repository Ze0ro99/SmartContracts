name: PiRC reference contract checks

on:
  pull_request:
    paths:
      - 'contracts/pirc_207_registry_v3/**'
      - 'contracts/pirc_214_oracle_v2/**'
      - 'contracts/pirc_214_oracle_quorum_v3/**'
      - 'contracts/pirc_225_por_v2/**'
      - 'contracts/pirc_237_ai_oracle/**'
      - 'contracts/ousd_test_token/**'
      - 'contracts/pidex_amm/**'
      - 'contracts/pirc_test_asset/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pirc-reference-contracts.yml'
  push:
    branches:
      - main
      - integration/sovereign-hybrid-ecosystem

permissions:
  contents: read

jobs:
  reference-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
      - name: Formatting baseline notice
        run: echo "Reference crates contain pre-existing rustfmt drift; formatting is tracked separately while compile and test gates remain mandatory."
      - name: Test reference crates
        run: cargo test -p pirc-207-registry-v3 -p pirc-214-oracle-v2 -p pirc-214-oracle-quorum-v3 -p pirc-225-por-v2 -p pirc-237-ai-oracle -p ousd-test-token -p pidex_amm -p pirc-test-asset
      - name: Build Soroban WASM artifacts
        run: cargo build --release --target wasm32-unknown-unknown -p pirc-207-registry-v3 -p pirc-214-oracle-v2 -p pirc-214-oracle-quorum-v3 -p pirc-225-por-v2 -p pirc-237-ai-oracle -p ousd-test-token
