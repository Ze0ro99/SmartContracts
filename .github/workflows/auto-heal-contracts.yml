name: Auto-Heal & Repair Smart Contracts

on:
  workflow_dispatch:
    inputs:
      fix_and_commit:
        description: 'Attempt to commit fixes to a repair branch?'
        type: boolean
        default: false
      max_contracts_to_fix:
        description: 'Maximum number of broken contracts to attempt fixing'
        required: false
        default: '15'
  schedule:
    - cron: '0 4 * * 1'   # Every Monday at 04:00 UTC
  push:
    branches: [main, master]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'

env:
  RUST_VERSION: '1.85'
  REPAIR_BRANCH: 'auto-repair/contracts'

jobs:
  # ========================================================
  # 1. Scan + Import from PiRC + Detect broken contracts
  # ========================================================
  scan-and-import:
    name: Scan Errors & Import PiRC Data
    runs-on: ubuntu-latest
    outputs:
      broken_contracts: ${{ steps.detect.outputs.broken }}
      valid_contracts: ${{ steps.detect.outputs.valid }}
    steps:
      - name: Checkout SmartContracts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout PiRC repository
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Ze0ro99/PiRC
          path: pirc-source
          fetch-depth: 1

      - name: Import useful data from PiRC
        run: |
          mkdir -p imported/{schemas,registries,manifests,templates,scripts}

          if [ -d pirc-source ]; then
            echo "→ Importing from PiRC..."
            cp -r pirc-source/schemas/* imported/schemas/ 2>/dev/null || true
            cp pirc-source/*.json imported/registries/ 2>/dev/null || true
            cp pirc-source/sovereign_manifest.json imported/manifests/ 2>/dev/null || true
            cp -r pirc-source/scripts/* imported/scripts/ 2>/dev/null || true

            # Collect any good Cargo.toml templates
            find pirc-source -name "Cargo.toml" | head -5 | while read f; do
              cp "$f" imported/templates/ 2>/dev/null || true
            done
            echo "PiRC data imported successfully"
          else
            echo "PiRC not available – will use local templates"
          fi

          # Always keep a clean template from the subscription contract
          if [ -f contracts/subscription/Cargo.toml ]; then
            cp contracts/subscription/Cargo.toml imported/templates/subscription-template.toml
            echo "Subscription template saved"
          fi

      - name: Detect broken and valid contracts
        id: detect
        run: |
          BROKEN=""
          VALID=""

          echo "Scanning contracts..."
          for dir in contracts/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            cargo_toml="${dir}Cargo.toml"

            if [ ! -f "$cargo_toml" ]; then
              echo "  - $name : missing Cargo.toml"
              BROKEN="$BROKEN $name"
              continue
            fi

            # Validate TOML syntax
            if python3 -c "import tomllib; tomllib.load(open('$cargo_toml', 'rb'))" 2>/dev/null; then
              echo "  ✓ $name : valid"
              VALID="$VALID $name"
            else
              echo "  ✗ $name : INVALID / corrupted Cargo.toml"
              BROKEN="$BROKEN $name"
            fi
          done

          # Convert to JSON arrays
          BROKEN_JSON=$(echo $BROKEN | tr ' ' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length>0))')
          VALID_JSON=$(echo $VALID | tr ' ' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length>0))')

          echo "broken=$BROKEN_JSON" >> $GITHUB_OUTPUT
          echo "valid=$VALID_JSON" >> $GITHUB_OUTPUT

          echo "Broken contracts: $BROKEN_JSON"
          echo "Valid contracts: $VALID_JSON"

      - name: Upload imported assets
        uses: actions/upload-artifact@v4
        with:
          name: imported-assets
          path: imported/
          retention-days: 7

  # ========================================================
  # 2. Auto-repair broken Cargo.toml files
  # ========================================================
  repair-contracts:
    name: Repair Broken Contracts
    needs: scan-and-import
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download imported assets
        uses: actions/download-artifact@v4
        with:
          name: imported-assets
          path: imported/

      - name: Repair broken Cargo.toml files
        id: repair
        run: |
          MAX_FIX=${{ github.event.inputs.max_contracts_to_fix || 15 }}
          FIXED=0

          BROKEN='${{ needs.scan-and-import.outputs.broken_contracts }}'
          echo "Broken contracts to process: $BROKEN"

          echo "$BROKEN" | jq -r '.[]' | while read -r name; do
            [ -z "$name" ] && continue
            [ $FIXED -ge $MAX_FIX ] && break

            cargo_toml="contracts/$name/Cargo.toml"
            echo ""
            echo "→ Attempting repair: $name"

            mkdir -p "contracts/$name/src"

            # Strategy 1: Use subscription as clean template
            if [ -f imported/templates/subscription-template.toml ]; then
              echo "  Using subscription template..."
              cat > "$cargo_toml" << EOF
          [package]
          name = "$name"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [lib]
          crate-type = ["cdylib", "lib"]
          doctest = false

          [dependencies]
          soroban-sdk = { workspace = true }

          [dev-dependencies]
          soroban-sdk = { workspace = true, features = ["testutils"] }
          EOF
            else
              # Strategy 2: Minimal clean Cargo.toml
              cat > "$cargo_toml" << EOF
          [package]
          name = "$name"
          version = "0.1.0"
          edition = "2021"

          [lib]
          crate-type = ["cdylib"]

          [dependencies]
          soroban-sdk = "22.0.0"
          EOF
            fi

            # Create minimal lib.rs if missing
            if [ ! -f "contracts/$name/src/lib.rs" ]; then
              cat > "contracts/$name/src/lib.rs" << 'EOF'
          #![no_std]
          use soroban_sdk::{contract, contractimpl, Env};

          #[contract]
          pub struct Contract;

          #[contractimpl]
          impl Contract {
              pub fn hello(env: Env) -> soroban_sdk::Symbol {
                  soroban_sdk::symbol_short!("Hello")
              }
          }
          EOF
              echo "  Created minimal src/lib.rs"
            fi

            # Validate the repaired file
            if python3 -c "import tomllib; tomllib.load(open('$cargo_toml', 'rb'))" 2>/dev/null; then
              echo "  ✓ Successfully repaired: $name"
              FIXED=$((FIXED + 1))
            else
              echo "  ✗ Failed to create valid Cargo.toml for $name"
            fi
          done

          echo "Repair process completed"

      - name: Create clean temporary workspace
        run: |
          cat > Cargo.toml.repaired << 'EOF'
          [workspace]
          resolver = "2"
          members = ["contracts/subscription"]

          [workspace.dependencies]
          soroban-sdk = "22.0.0"

          [profile.release]
          opt-level = "z"
          overflow-checks = true
          debug = 0
          strip = "symbols"
          panic = "abort"
          codegen-units = 1
          lto = true
          EOF

          cp Cargo.toml Cargo.toml.bak 2>/dev/null || true
          cp Cargo.toml.repaired Cargo.toml

      - name: Test build of subscription (reference contract)
        continue-on-error: true
        run: |
          cargo build --target wasm32-unknown-unknown --release \
            --manifest-path contracts/subscription/Cargo.toml || true

      - name: Upload repaired files
        uses: actions/upload-artifact@v4
        with:
          name: repaired-contracts
          path: |
            contracts/**/Cargo.toml
            contracts/**/src/lib.rs
          retention-days: 5

      - name: Optional - Commit repairs to a branch
        if: ${{ github.event.inputs.fix_and_commit == true }}
        run: |
          git config user.name "Auto-Heal Bot"
          git config user.email "auto-heal@users.noreply.github.com"

          git checkout -b ${{ env.REPAIR_BRANCH }} || git checkout ${{ env.REPAIR_BRANCH }}

          git add contracts/*/Cargo.toml contracts/*/src/lib.rs || true
          git add Cargo.toml || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(auto-heal): repair corrupted Cargo.toml files and add minimal lib.rs"
            git push origin ${{ env.REPAIR_BRANCH }} --force || true
            echo "Pushed repairs to branch ${{ env.REPAIR_BRANCH }}"
          fi

  # ========================================================
  # 3. Final Report
  # ========================================================
  report:
    name: Generate Heal Report
    needs: [scan-and-import, repair-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Create Report
        run: |
          echo "# Auto-Heal Contracts Report" > HEAL_REPORT.md
          echo "**Date:** $(date -u)" >> HEAL_REPORT.md
          echo "" >> HEAL_REPORT.md
          echo "## Summary" >> HEAL_REPORT.md
          echo "- Scanned all contracts for invalid or missing Cargo.toml" >> HEAL_REPORT.md
          echo "- Imported data from Ze0ro99/PiRC when available" >> HEAL_REPORT.md
          echo "- Automatically repaired broken manifests" >> HEAL_REPORT.md
          echo "- Created minimal valid Cargo.toml + lib.rs for broken packages" >> HEAL_REPORT.md
          echo "- Used the subscription contract as a clean template" >> HEAL_REPORT.md
          echo "" >> HEAL_REPORT.md
          echo "## Next Steps" >> HEAL_REPORT.md
          echo "1. Review the repaired files in the artifacts" >> HEAL_REPORT.md
          echo "2. If fix_and_commit was enabled, check the branch: auto-repair/contracts" >> HEAL_REPORT.md
          echo "3. Manually improve the generated contracts as needed" >> HEAL_REPORT.md

      - uses: actions/upload-artifact@v4
        with:
          name: HEAL-REPORT
          path: HEAL_REPORT.md
