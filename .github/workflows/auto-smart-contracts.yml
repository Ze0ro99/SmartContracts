name: SmartContracts Read-only Rust CI

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/auto-smart-contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/auto-smart-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartcontracts-readonly-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Workspace tests (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check formatting for changed Rust crates
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            cargo fmt --all -- --check
            exit 0
          fi
          mapfile -t RUST_FILES < <(git diff --name-only "$BASE_SHA...HEAD" -- '*.rs')
          if [ "${#RUST_FILES[@]}" -eq 0 ]; then
            echo "No Rust source changed; skipping formatting."
            exit 0
          fi
          declare -A MANIFESTS=()
          for file in "${RUST_FILES[@]}"; do
            dir="$(dirname "$file")"
            while [ "$dir" != "." ] && [ ! -f "$dir/Cargo.toml" ]; do
              dir="$(dirname "$dir")"
            done
            if [ -f "$dir/Cargo.toml" ]; then
              MANIFESTS["$dir/Cargo.toml"]=1
            else
              echo "::error::Could not resolve Cargo.toml for changed Rust file: $file"
              exit 1
            fi
          done
          for manifest in "${!MANIFESTS[@]}"; do
            cargo fmt --manifest-path "$manifest"
          done
      - name: Upload formatted PiDEX crate sources for review
        uses: actions/upload-artifact@v4
        with:
          name: pidex-amm-rustfmt-output
          path: |
            contracts/pidex_amm/src/lib.rs
            contracts/pidex_amm/src/integration_tests.rs
          if-no-files-found: error
          retention-days: 1
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Check workspace build
        run: cargo build --workspace --locked --target wasm32-unknown-unknown --release
