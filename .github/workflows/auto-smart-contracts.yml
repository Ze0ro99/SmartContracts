name: SmartContracts Read-only Rust CI

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/auto-smart-contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/auto-smart-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartcontracts-readonly-ci-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Workspace tests (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: \${{ runner.os }}-cargo-\${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            \${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Check workspace build
        run: cargo build --workspace --locked --target wasm32-unknown-unknown --release
