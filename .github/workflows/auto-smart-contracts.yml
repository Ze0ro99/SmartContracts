name: Auto Smart Contracts Controller

on:
  schedule:
    - cron: '0 * * * *'              # Every hour
  push:
    branches: [main, master, develop]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - '.github/workflows/auto-smart-contracts.yml'
  workflow_dispatch:
    inputs:
      force_heal_all:
        description: 'Force heal all contracts'
        type: boolean
        default: false
      push_repairs:
        description: 'Commit & push repaired files'
        type: boolean
        default: true
      reset_cycle:
        description: 'Reset processed contracts cycle'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: auto-controller-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.85'
  SOROBAN_SDK: '22.0.11'
  MAX_BUILD_CONTRACTS: '12'
  MAX_HEAL: '80'
  REPAIR_BRANCH: 'auto-repair/contracts'
  ARTIFACTS_DAYS: 14

jobs:
  # ============================================================
  # 1. Heal all broken contracts + rotating matrix + export
  # ============================================================
  heal-and-export:
    name: Heal + Rotate + Export
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_work: ${{ steps.matrix.outputs.has_work }}
      repaired_count: ${{ steps.heal.outputs.repaired }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import PiRC (optional)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Ze0ro99/PiRC
          path: pirc-import
          fetch-depth: 1

      - name: Prepare assets
        run: |
          mkdir -p imported/{schemas,registries,manifests,templates,exports}

          if [ -d pirc-import ]; then
            echo "→ Importing from PiRC..."
            cp -r pirc-import/schemas/. imported/schemas/ 2>/dev/null || true
            cp pirc-import/*.json imported/registries/ 2>/dev/null || true
            cp pirc-import/sovereign_manifest.json imported/manifests/ 2>/dev/null || true
          else
            echo "→ PiRC unavailable – using fallbacks"
          fi

          echo '{"contracts":[],"version":"controller","source":"auto-controller"}' > imported/registries/CONTRACTS_REGISTRY.json
          echo '{"name":"Controller Manifest","version":"1.0"}' > imported/manifests/sovereign_manifest.json
          echo '{"title":"Fallback Schema","type":"object"}' > imported/schemas/fallback.json

          if [ -f contracts/subscription/Cargo.toml ]; then
            cp contracts/subscription/Cargo.toml imported/templates/clean.toml
          fi

      - name: Heal broken / outdated contracts
        id: heal
        run: |
          set +e
          REPAIRED=0
          FORCE="${{ github.event.inputs.force_heal_all || 'false' }}"

          for dir in contracts/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            f="${dir}Cargo.toml"
            NEED_HEAL=false

            if [ ! -f "$f" ]; then
              NEED_HEAL=true
            elif ! python3 -c "import tomllib; tomllib.load(open('$f','rb'))" 2>/dev/null; then
              NEED_HEAL=true
              echo "Invalid TOML → $name"
            elif [ "$FORCE" = "true" ]; then
              NEED_HEAL=true
            elif grep -qE 'soroban-sdk\s*=\s*"(20|21)\.' "$f" 2>/dev/null; then
              NEED_HEAL=true
              echo "Outdated SDK → $name"
            fi

            [ "$NEED_HEAL" = "false" ] && continue
            [ $REPAIRED -ge ${{ env.MAX_HEAL }} ] && break

            echo "→ Healing: $name"
            mkdir -p "${dir}src"

            cat > "$f" << EOF
          [package]
          name = "${name//_/-}"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [lib]
          crate-type = ["cdylib", "lib"]
          doctest = false

          [dependencies]
          soroban-sdk = { workspace = true }

          [dev-dependencies]
          soroban-sdk = { workspace = true, features = ["testutils"] }
          EOF

            if [ ! -f "${dir}src/lib.rs" ]; then
              cat > "${dir}src/lib.rs" << 'EOF'
          #![no_std]
          use soroban_sdk::{contract, contractimpl, Env, Symbol};

          #[contract]
          pub struct Contract;

          #[contractimpl]
          impl Contract {
              pub fn ping(env: Env) -> Symbol {
                  Symbol::new(&env, "ok")
              }
          }
          EOF
            fi

            if python3 -c "import tomllib; tomllib.load(open('$f','rb'))" 2>/dev/null; then
              echo "  ✓ Healed: $name"
              REPAIRED=$((REPAIRED + 1))
            else
              echo "  ✗ Failed: $name"
            fi
          done

          echo "repaired=$REPAIRED" >> "$GITHUB_OUTPUT"
          echo "=== Total repaired: $REPAIRED ==="
          find contracts -name Cargo.toml | sort > imported/exports/healed-list.txt

      - name: Build rotating matrix (12 NEW contracts each hour)
        id: matrix
        run: |
          set -euo pipefail
          STATE_FILE="imported/exports/build-state.json"
          mkdir -p imported/exports

          RESET="${{ github.event.inputs.reset_cycle || 'false' }}"

          if [ "$RESET" = "true" ] || [ ! -f "$STATE_FILE" ]; then
            echo '{"processed":[],"last_run":""}' > "$STATE_FILE"
            echo "State reset / initialized"
          fi

          PROCESSED=$(jq -r '.processed[]?' "$STATE_FILE" 2>/dev/null || true)

          # Collect all valid contracts
          ALL=()
          if [ -f contracts/subscription/Cargo.toml ] && \
             python3 -c "import tomllib; tomllib.load(open('contracts/subscription/Cargo.toml','rb'))" 2>/dev/null; then
            ALL+=("subscription")
          fi

          for dir in contracts/*/; do
            name=$(basename "$dir")
            [ "$name" = "subscription" ] && continue
            f="${dir}Cargo.toml"
            [ -f "$f" ] || continue
            if python3 -c "import tomllib; tomllib.load(open('$f','rb'))" 2>/dev/null; then
              ALL+=("$name")
            fi
          done

          echo "Total valid contracts found: ${#ALL[@]}"

          # Select up to 12 NOT yet processed
          SELECTED=()
          for c in "${ALL[@]}"; do
            if echo "$PROCESSED" | grep -qx "$c"; then
              continue
            fi
            SELECTED+=("$c")
            if [ ${#SELECTED[@]} -ge ${{ env.MAX_BUILD_CONTRACTS }} ]; then
              break
            fi
          done

          # If all processed → reset cycle and start over
          if [ ${#SELECTED[@]} -eq 0 ] && [ ${#ALL[@]} -gt 0 ]; then
            echo "All contracts already processed → resetting cycle"
            echo '{"processed":[],"last_run":""}' > "$STATE_FILE"
            SELECTED=()
            for c in "${ALL[@]}"; do
              SELECTED+=("$c")
              if [ ${#SELECTED[@]} -ge ${{ env.MAX_BUILD_CONTRACTS }} ]; then
                break
              fi
            done
          fi

          # Always prefer including subscription if valid and not already selected
          if [[ " ${ALL[*]} " == *" subscription "* ]] && [[ ! " ${SELECTED[*]} " == *" subscription "* ]]; then
            SELECTED=("subscription" "${SELECTED[@]}")
            # trim to max
            SELECTED=("${SELECTED[@]:0:${{ env.MAX_BUILD_CONTRACTS }}}")
          fi

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "No contracts to build"
            exit 0
          fi

          # Update state
          NEW_PROCESSED=$(printf '%s\n' $PROCESSED "${SELECTED[@]}" | grep -v '^$' | sort -u)
          jq -n \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson list "$(printf '%s\n' $NEW_PROCESSED | jq -Rnc '[inputs]')" \
            '{processed: $list, last_run: $ts}' > "$STATE_FILE"

          MATRIX=$(printf '%s\n' "${SELECTED[@]}" | jq -Rnc '{include: [inputs | select(length>0) | {contract: .}]}')
          echo "has_work=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "This hour batch (${#SELECTED[@]}): ${SELECTED[*]}"

      - name: Commit & push repairs + state
        if: ${{ github.event.inputs.push_repairs != 'false' }}
        run: |
          git config user.name "Auto-Controller Bot"
          git config user.email "auto-controller@users.noreply.github.com"

          git add contracts/*/Cargo.toml contracts/*/src/lib.rs 2>/dev/null || true
          git add Cargo.toml 2>/dev/null || true
          git add imported/exports/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git checkout -B ${{ env.REPAIR_BRANCH }}
            git commit -m "chore(auto-heal): repair contracts + rotate build state [skip ci]"
            git push origin ${{ env.REPAIR_BRANCH }} --force

            echo "✓ Repairs pushed to branch: ${{ env.REPAIR_BRANCH }}"

            # Best-effort merge into main
            git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
            git merge ${{ env.REPAIR_BRANCH }} -m "merge: auto-healed contracts" || true
            git push origin HEAD:main 2>/dev/null || \
            git push origin HEAD:master 2>/dev/null || \
              echo "Note: Could not push to main (branch protection). Merge PR from ${{ env.REPAIR_BRANCH }} manually."
          fi

      - name: Upload exports
        uses: actions/upload-artifact@v4
        with:
          name: healed-exports
          path: |
            imported/
            contracts/**/Cargo.toml
          retention-days: ${{ env.ARTIFACTS_DAYS }}
          if-no-files-found: ignore

  # ============================================================
  # 2. Build + Test + Diagrams (max 12, rotating)
  # ============================================================
  build:
    name: Build → ${{ matrix.contract }}
    needs: heal-and-export
    if: needs.heal-and-export.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.heal-and-export.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ctrl-${{ matrix.contract }}-${{ hashFiles(format('contracts/{0}/Cargo.toml', matrix.contract)) }}

      - name: Create isolated workspace
        run: |
          CONTRACT="${{ matrix.contract }}"
          cp Cargo.toml Cargo.toml.bak 2>/dev/null || true
          cat > Cargo.toml << EOF
          [workspace]
          resolver = "2"
          members = ["contracts/${CONTRACT}"]

          [workspace.dependencies]
          soroban-sdk = "${{ env.SOROBAN_SDK }}"

          [profile.release]
          opt-level = "z"
          overflow-checks = true
          debug = 0
          strip = "symbols"
          panic = "abort"
          codegen-units = 1
          lto = true
          EOF

      - name: Build
        id: build
        continue-on-error: true
        run: |
          cargo build --target wasm32-unknown-unknown --release \
            --manifest-path "contracts/${{ matrix.contract }}/Cargo.toml"

      - name: Test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          cargo test --manifest-path "contracts/${{ matrix.contract }}/Cargo.toml" -- --nocapture || true

      - name: Generate report + diagram
        run: |
          mkdir -p "reports/${{ matrix.contract }}/diagrams"
          STATUS="FAILED"
          [ "${{ steps.build.outcome }}" = "success" ] && STATUS="SUCCESS"

          cat > "reports/${{ matrix.contract }}/REPORT.md" << EOF
          # Controller Report – ${{ matrix.contract }}
          - Status: $STATUS
          - Date: $(date -u)
          - Isolated: yes
          - SDK: ${{ env.SOROBAN_SDK }}
          - Source: Auto Controller (rotating)
          EOF

          cat > "reports/${{ matrix.contract }}/diagrams/flow.mmd" << 'EOF'
          sequenceDiagram
              participant Controller
              participant Heal
              participant Build
              participant OtherWorkflows
              Controller->>Heal: Repair Cargo.toml + SDK
              Heal->>Build: Build 12 NEW contracts
              Heal->>OtherWorkflows: Push fixed files
              Build->>Controller: Report + Diagram
          EOF

      - name: Restore workspace
        if: always()
        run: |
          [ -f Cargo.toml.bak ] && mv Cargo.toml.bak Cargo.toml || true

      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.contract }}
          path: reports/${{ matrix.contract }}/
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACTS_DAYS }}

  # ============================================================
  # 3. Master Summary
  # ============================================================
  summary:
    name: Controller Summary
    needs: [heal-and-export, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Write summary
        run: |
          echo "# Auto Controller – Master Summary" > SUMMARY.md
          echo "**Date:** $(date -u)" >> SUMMARY.md
          echo "**Repaired:** ${{ needs.heal-and-export.outputs.repaired_count }}" >> SUMMARY.md
          echo "**Build limit:** ${{ env.MAX_BUILD_CONTRACTS }} NEW contracts per hour" >> SUMMARY.md
          echo "**Schedule:** Every hour" >> SUMMARY.md
          echo "" >> SUMMARY.md
          echo "## Features" >> SUMMARY.md
          echo "- Heals up to 80 broken/outdated contracts" >> SUMMARY.md
          echo "- Rotates 12 NEW contracts each hour (no repeat until full cycle)" >> SUMMARY.md
          echo "- Pushes fixes to \`${{ env.REPAIR_BRANCH }}\`" >> SUMMARY.md
          echo "- Other workflows receive fixed files after merge" >> SUMMARY.md
          echo "- Handles future new contracts automatically" >> SUMMARY.md
          echo "- Generates reports + Mermaid diagrams" >> SUMMARY.md

      - uses: actions/upload-artifact@v4
        with:
          name: CONTROLLER-SUMMARY
          path: |
            SUMMARY.md
            all-artifacts/
          if-no-files-found: ignore
