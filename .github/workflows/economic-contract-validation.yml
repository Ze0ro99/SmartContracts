name: Economic Contract Validation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - ".devcontainer/**"
      - "docs/LOCAL_DEVELOPMENT_ENVIRONMENT.md"
      - "docs/DEVELOPMENT_COMMANDS.md"
      - "contracts/**"
      - "fixtures/economic-engine-vectors.json"
      - "scripts/test_economic_vectors.py"
      - "docs/ECONOMIC_SETTLEMENT_PARITY_GATE.md"
      - ".github/workflows/economic-contract-validation.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "Makefile"
      - ".devcontainer/**"
      - "contracts/**"
      - "fixtures/economic-engine-vectors.json"
      - "scripts/test_economic_vectors.py"
      - "docs/ECONOMIC_SETTLEMENT_PARITY_GATE.md"
      - "docs/LOCAL_DEVELOPMENT_ENVIRONMENT.md"
      - "docs/DEVELOPMENT_COMMANDS.md"
      - ".github/workflows/economic-contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: economic-contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-validation:
    name: Validate shared economic vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical fixture arithmetic
        run: python scripts/test_economic_vectors.py

  soroban-workspace-tests:
    name: Compile and test Soroban workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Formatting baseline notice
        run: echo "Reference contract formatting debt is tracked separately; compile and test gates remain mandatory."
      - name: Validate committed workspace lockfile
        run: cargo metadata --locked --format-version 1 > /tmp/workspace-metadata.json
      - name: Compile workspace
        run: cargo check --workspace --locked
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Build canonical settlement WASM
        run: cargo build --locked --release --target wasm32-unknown-unknown -p pirc-economic-settlement
